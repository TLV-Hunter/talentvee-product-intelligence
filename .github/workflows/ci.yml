name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find extension/extension -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run Connector regression tests
        if: ${{ hashFiles('extension/tests/connector-regression.test.mjs') != '' }}
        run: node --test extension/tests/connector-regression.test.mjs

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build Sites reference
        run: npm run build
      - name: Build and test GitHub Pages
        run: npm test
